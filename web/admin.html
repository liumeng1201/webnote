<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebNote 管理后台</title>
<link rel="stylesheet" href="/static/style.css?v=7">
</head>
<body class="page-admin">

<div id="loginBox" class="unlock-wrap hidden">
  <div class="unlock-card">
    <div class="unlock-icon" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
      </svg>
    </div>
    <h2 class="unlock-title">管理员登录</h2>
    <div class="muted small">输入部署时指定的管理员密码</div>
    <form id="loginForm">
      <input type="password" id="adminPw" placeholder="请输入管理员密码" autocomplete="current-password">
      <button class="primary" type="submit">进入后台</button>
    </form>
    <div id="loginErr" class="small unlock-err"></div>
    <div class="unlock-back"><a href="/">← 返回首页</a></div>
  </div>
</div>

<div id="mainBox" class="admin-shell hidden">
  <header class="topbar">
    <div class="topbar-left">
      <a href="/" class="brand-link" title="返回首页">
        <span class="brand-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
        </span>
        <span class="spacename">WebNote 管理后台</span>
      </a>
      <span class="v-sep" aria-hidden="true"></span>
      <span class="pill pill-neutral" id="summary"></span>
    </div>

    <div class="topbar-right">
      <a href="/api/admin/backup" class="nav-link-btn" title="下载便签数据备份">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span class="btn-text">下载备份</span>
      </a>
      <button type="button" class="icon-btn" id="refreshBtn" title="刷新数据">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
        <span class="btn-text">刷新</span>
      </button>
      <span class="v-sep" aria-hidden="true"></span>
      <button type="button" class="icon-btn" id="logoutBtn" title="退出登录">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span class="btn-text">退出</span>
      </button>
    </div>
  </header>

  <main class="admin-wrap">
    <section class="admin-kpi-grid" aria-label="系统概览">
      <div class="admin-kpi-card">
        <div class="admin-kpi-label">便签空间</div>
        <div class="admin-kpi-val" id="kpiSpaces">0</div>
      </div>
      <div class="admin-kpi-card">
        <div class="admin-kpi-label">标签总占用</div>
        <div class="admin-kpi-val" id="kpiTabsSize">0 B</div>
      </div>
      <div class="admin-kpi-card">
        <div class="admin-kpi-label">暂存文件占用</div>
        <div class="admin-kpi-val" id="kpiFilesSize">0 B</div>
      </div>
    </section>

    <div id="spaceList" class="admin-space-list"></div>
  </main>
</div>

<div id="toast"></div>
<script src="/static/admin.js?v=7"></script>
</body>
</html>
